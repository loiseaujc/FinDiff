name = "FinDiff"
version = "0.1.0"
license = "license"
author = "Jean-Christophe"
maintainer = "loiseau.jc@gmail.com"
copyright = "Copyright 2025, Jean-Christophe"
[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false
[install]
library = false
test = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"
[dependencies]
stdlib = {path="local_deps/stdlib128"}
assert = {git="https://github.com/BerkeleyLab/assert.git"}
[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive"}
